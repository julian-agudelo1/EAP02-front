serenity {
    take.screenshots = FOR_FAILURES
    use.unique.browser = true
    test.root = co.com.devnet.screenplay
    console.colors = true
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
}

headless.mode = false

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
  }
}

chrome.switches = """--start-maximized;--window-size=1440,1200;--test-type;--no-sandbox;--ignore-certificate-errors;
                   --disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;
                   --incognito;--disable-infobars;--disable-gpu;--remote-allow-origins=*"""

pages {
    devnetUrl = "http://127.0.0.1:5173/"
}